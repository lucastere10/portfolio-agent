[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Conversational portfolio agent powered by Google ADK and FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "google-adk>=2.2.0",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]
