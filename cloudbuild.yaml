substitutions:
  # Infra
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _DEPLOY_REGION: us-central1
  _AR_REPO: portfolio-images
  _SERVICE_NAME: portfolio-agent
  _RUNTIME_SA: portfolio-sa
  _WEB_RUNTIME_SA: portfolio-sa
  _IMAGE: ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}
  _CONCURRENCY: "80"
  _LABEL_APP: portfolio
  _LABEL_ENV: production
  _LABEL_OWNER: lucas

  # Secrets
  _SECRET_GEMINI_API_KEY: portfolio-gemini-api-key

  # Application
  _LLM_PROVIDER: gemini
  _PORTFOLIO_AGENT_GEMINI_MODEL: gemini-2.5-flash
  _PORTFOLIO_WEB_BASE_URL: https://portfolio.caldasdev.com.br
  _APP_VERSION: 0.1.0
  _DEBUG: "false"
  _SESSION_TTL_SECONDS: "1800"
  _SESSION_MAX_MESSAGES: "20"
  _CORS_ORIGINS: "https://portfolio.caldasdev.com.br"

steps:
  - id: validate-secrets
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - scripts/cloudbuild/validate-secrets.sh
      - ${_SECRET_GEMINI_API_KEY}

  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${COMMIT_SHA}
      - -t
      - ${_IMAGE}:latest
      - .

  - id: Push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker push "${_IMAGE}:${COMMIT_SHA}"
        docker push "${_IMAGE}:latest"

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_DEPLOY_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --min-instances=0
      - --max-instances=10
      - --cpu-boost
      - --concurrency=${_CONCURRENCY}
      - --revision-suffix=${SHORT_SHA}
      - --labels=app=${_LABEL_APP},env=${_LABEL_ENV},owner=${_LABEL_OWNER}
      - --execution-environment=gen2
      - --set-env-vars=LLM_PROVIDER=${_LLM_PROVIDER}
      - --set-env-vars=PORTFOLIO_AGENT_GEMINI_MODEL=${_PORTFOLIO_AGENT_GEMINI_MODEL}
      - --set-env-vars=APP_VERSION=${_APP_VERSION}
      - --set-env-vars=DEBUG=${_DEBUG}
      - --set-env-vars=SESSION_TTL_SECONDS=${_SESSION_TTL_SECONDS}
      - --set-env-vars=SESSION_MAX_MESSAGES=${_SESSION_MAX_MESSAGES}
      - --set-env-vars=PORTFOLIO_WEB_BASE_URL=${_PORTFOLIO_WEB_BASE_URL}
      - --set-env-vars=CORS_ORIGINS=${_CORS_ORIGINS}
      - "--set-secrets=PORTFOLIO_AGENT_GEMINI_API_KEY=${_SECRET_GEMINI_API_KEY}:latest"

  - id: grant-web-invoker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - ${_SERVICE_NAME}
      - --region=${_DEPLOY_REGION}
      - --member=serviceAccount:${_WEB_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --role=roles/run.invoker

  - id: verify-health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - scripts/cloudbuild/verify-health.sh
      - ${_SERVICE_NAME}
      - ${_DEPLOY_REGION}
      - ${_WEB_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/cloud-build-sa@${PROJECT_ID}.iam.gserviceaccount.com
